<!DOCTYPE html>
<html>
<body style="margin:0; background:#111;">
<canvas id="c" width="1700" height="900"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

// Input //
const keys = {};
addEventListener("keydown", e => keys[e.code] = true);
addEventListener("keyup", e => keys[e.code] = false);
var pressedThisFrame = true;

function getRandomInt(max) {
  return Math.floor(Math.random() * max);
}

var player = {x: 200, xl: 0, y: 100, vy: 0, vx: 0, sizeX: 124, sizeY: 120};
var platform1 = {x: getRandomInt(1601), y: getRandomInt(876), sizeX: 100, sizeY: 1};
var platform2 = {x: getRandomInt(1601), y: getRandomInt(876), sizeX: 100, sizeY: 1};
var platform3 = {x: getRandomInt(1601), y: getRandomInt(876), sizeX: 100, sizeY: 1};
var platform4 = {x: getRandomInt(1601), y: getRandomInt(876), sizeX: 100, sizeY: 1};
var platform5 = {x: getRandomInt(1601), y: getRandomInt(876), sizeX: 100, sizeY: 1};
var platform6 = {x: getRandomInt(1601), y: getRandomInt(876), sizeX: 100, sizeY: 1};
var platform7 = {x: getRandomInt(1601), y: getRandomInt(876), sizeX: 100, sizeY: 1};
var platform8 = {x: getRandomInt(1601), y: getRandomInt(876), sizeX: 100, sizeY: 1};
var platform9 = {x: getRandomInt(1601), y: getRandomInt(876), sizeX: 100, sizeY: 1};
var platform10 = {x: getRandomInt(1601), y: getRandomInt(876), sizeX: 100, sizeY: 1};
var platform11 = {x: getRandomInt(1601), y: getRandomInt(876), sizeX: 100, sizeY: 1};
var platform12 = {x: getRandomInt(1601), y: getRandomInt(876), sizeX: 100, sizeY: 1};
var platform13 = {x: getRandomInt(1601), y: getRandomInt(876), sizeX: 100, sizeY: 1};
var platform14 = {x: getRandomInt(1601), y: getRandomInt(876), sizeX: 100, sizeY: 1};
var platform15 = {x: getRandomInt(1601), y: getRandomInt(876), sizeX: 100, sizeY: 1};
var platformB1 = {x: getRandomInt(1601), y: getRandomInt(876), sizeX: 100, sizeY: 1, breaking: false};
var platformB2 = {x: getRandomInt(1601), y: getRandomInt(876), sizeX: 100, sizeY: 1, breaking: false};
var star = {x: platform8.x + 25, y: platform8.y - 60, sizeX: 50, sizeY: 50};
const gravity = .4;
var score = player.y;
var highScore = null;
var isFacingRight = true;

const playerTex = new Image();
playerTex.src = "gfx/doodler_right.png";
const platTex = new Image();
platTex.src = "gfx/plat.png";
const breakTex = new Image();
breakTex.src = "gfx/platBreak.png";
const win = new Image();
win.src = "gfx/win.png";

var gameOver = false;

// Collisions //
function isCollidingWith(other) {

	if(player.vy > 0){
    return (
      player.x <= other.x + other.sizeX &&
      player.x + player.sizeX >= other.x &&
      player.y + 80 <= other.y + other.sizeY &&
      player.y + 80 + player.sizeY - 80 >= other.y
    );
	}
}
	
// Game loop //
function frame() {
	
	player.xl = player.x;
	
	// Input //
	if(keys["ArrowLeft"] && !gameOver){
		player.x -= 10;
	}
	if(keys["ArrowRight"] && !gameOver){
		player.x += 10;
	}
	//if(keys["ArrowUp"] && pressedThisFrame && !gameOver){ 
	// 	player.vy = -12.5;
	//	pressedThisFrame = false;	
	//}else if(!keys["ArrowUp"] && !pressedThisFrame){
	//	pressedThisFrame = true;
	//}
	if(keys["Enter"] && star.x > 100000 || keys["Enter"] && gameOver){
		gameOver = false;
		
		if(score < highScore){
			highScore = score;
		}
		
		score = player.x;
		
		player.x = 200;
		player.y = 100;
		player.vy = 0;
		player.vx = 0;
		
		platform1.x = getRandomInt(1601); platform1.y = getRandomInt(876);
		platform2.x = getRandomInt(1601); platform2.y = getRandomInt(876);
		platform3.x = getRandomInt(1601); platform3.y = getRandomInt(876);
		platform4.x = getRandomInt(1601); platform4.y = getRandomInt(876);
		platform5.x = getRandomInt(1601); platform5.y = getRandomInt(876);
		platform6.x = getRandomInt(1601); platform6.y = getRandomInt(876);
		platform7.x = getRandomInt(1601); platform7.y = getRandomInt(876);
		platform8.x = getRandomInt(1601); platform8.y = getRandomInt(876);
		platform9.x = getRandomInt(1601); platform9.y = getRandomInt(876);
		platform10.x = getRandomInt(1601); platform10.y = getRandomInt(876);
		platform11.x = getRandomInt(1601); platform11.y = getRandomInt(876);
		platform12.x = getRandomInt(1601); platform12.y = getRandomInt(876);
		platform13.x = getRandomInt(1601); platform13.y = getRandomInt(876);
		platform14.x = getRandomInt(1601); platform14.y = getRandomInt(876);
		platformB1.x = getRandomInt(1601); platformB1.y = getRandomInt(876);
		platformB2.x = getRandomInt(1601); platformB2.y = getRandomInt(876);
		star.x = platform8.x + 25; star.y = platform8.y - 60;
	}
	
	// Game logic //
	player.vx = player.xl - player.x;
	
	// gravity
	player.vy += gravity;
	if(player.vy > 15){
		player.vy = 15;
	}
	player.y += player.vy;

	if(isCollidingWith(platform1)){
		player.vy = -15;
	}else if(isCollidingWith(platform2)){
		player.vy = -15;
	}else if(isCollidingWith(platform3)){
		player.vy = -15;
	}else if(isCollidingWith(platform4)){
		player.vy = -15;
	}else if(isCollidingWith(platform5)){
		player.vy = -15;
	}else if(isCollidingWith(platform6)){
		player.vy = -15;
	}else if(isCollidingWith(platform7)){
		player.vy = -15;
	}else if(isCollidingWith(platform8)){
		player.vy = -15;
	}else if(isCollidingWith(platform9)){
		player.vy = -15;
	}else if(isCollidingWith(platform10)){
		player.vy = -15;
	}else if(isCollidingWith(platform11)){
		player.vy = -15;
	}else if(isCollidingWith(platform12)){
		player.vy = -15;
	}else if(isCollidingWith(platform13)){
		player.vy = -15;
	}else if(isCollidingWith(platform14)){
		player.vy = -15;
	}else if(isCollidingWith(platformB1)){
		platformB1.breaking = true;
	}else if(isCollidingWith(platformB2)){
		platformB2.breaking = true;
	}else if(isCollidingWith(star)){
		console.log("yayyy");
		star.x = 500000;
	}
	
	if(platformB1.breaking){
		platformB1.y += 10;
	}else if(platformB2.breaking){
		platformB2.y += 10;
	}	
	
	// Walls //
	if(player.x >= 1700){
		player.x = -50;
	}else if(player.x <= -50){
		player.x = 1700;
	}
	
	// Floor //
	if(player.y >= 850){
		gameOver = true
	}
	
	// score system //
	if(score > player.y){
		score = player.y;
	}
	
	// Render //
	ctx.fillStyle = "#e8f6fd";
	ctx.fillRect(0, 0, 1700, 900);
	
	if(keys["ArrowUp"] && !gameOver){ 
		playerTex.src = "gfx/doodler_shoot.png";
	}else if(player.vx > 0.1){
		playerTex.src = "gfx/doodler_left.png";
		isFacingRight = false;
	}else if(player.vx < 0.1){
		playerTex.src = "gfx/doodler_right.png";
		isFacingRight = true;
	}
	
	ctx.drawImage(platTex, platform1.x, platform1.y, platform1.sizeX, 24);
	ctx.drawImage(platTex, platform2.x, platform2.y, platform2.sizeX, 24);
	ctx.drawImage(platTex, platform3.x, platform3.y, platform3.sizeX, 24);
	ctx.drawImage(platTex, platform4.x, platform4.y, platform4.sizeX, 24);
	ctx.drawImage(platTex, platform5.x, platform5.y, platform5.sizeX, 24);
	ctx.drawImage(platTex, platform6.x, platform6.y, platform6.sizeX, 24);
	ctx.drawImage(platTex, platform7.x, platform7.y, platform7.sizeX, 24);
	ctx.drawImage(platTex, platform8.x, platform8.y, platform8.sizeX, 24);
	ctx.drawImage(platTex, platform9.x, platform9.y, platform9.sizeX, 24);
	ctx.drawImage(platTex, platform10.x, platform10.y, platform10.sizeX, 24);
	ctx.drawImage(platTex, platform11.x, platform11.y, platform11.sizeX, 24);
	ctx.drawImage(platTex, platform12.x, platform12.y, platform12.sizeX, 24);
	ctx.drawImage(platTex, platform13.x, platform13.y, platform13.sizeX, 24);
	ctx.drawImage(platTex, platform14.x, platform14.y, platform14.sizeX, 24);
	ctx.drawImage(breakTex, platformB1.x, platformB1.y, platformB1.sizeX, 24);
	ctx.drawImage(breakTex, platformB2.x, platformB2.y, platformB2.sizeX, 24);
	ctx.drawImage(playerTex, player.x, player.y, 124, 120);
	ctx.drawImage(win, star.x, star.y, star.sizeX, star.sizeY);
	//ctx.drawImage(platTex, player.x + 30, player.y + 80, player.sizeX - 60, player.sizeY - 80);
	
	//Text
	//ctx.font = "48px serif";
	//ctx.fillStyle = "gray";
	//ctx.fillText(player.vy, 10, 50);
	//ctx.fillText(player.vx, 10, 100);
	//ctx.fillText(player.x, 10, 150);
	//ctx.fillText(player.y, 10, 200);
	//ctx.fillText(score * -1, 10, 250);
	//ctx.fillText(highScore * -1, 10, 300);

	if(gameOver){
		ctx.font = "48px serif";
		ctx.fillStyle = "red";
		ctx.fillText("GAME OVER", 10, 350);
		ctx.fillStyle = "gray";
		ctx.fillText("Press Enter to restart...", 10, 400);
	}else if(star.x > 100000){
		ctx.font = "48px serif";
		ctx.fillStyle = "green";
		ctx.fillText("YOU WIN!!!", 10, 350);
		ctx.fillStyle = "gray";
		ctx.fillText("Press Enter to restart...", 10, 400);
	}
	
	requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
